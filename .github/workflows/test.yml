name: test
on:
  - push
  - pull_request
  - workflow_dispatch

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.runner }} Ruby ${{ matrix.ruby }}
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - macos-15-intel
          - macos-15
          - windows-2025
        ruby: ["3.4", "4.0"]
        include:
          - runner: ubuntu-24.04
            ruby: "3.2"
          - runner: ubuntu-24.04
            ruby: "3.3"
          # Keep the older Windows ABI used by the x64-mingw32 gem.
          - runner: windows-2022
            ruby: "2.7"
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Download libui shared libraries
        run: bundle exec rake vendor:auto
      - name: Rake test
        uses: coactions/setup-xvfb@v1
        with:
          run: bundle exec rake test

  jruby:
    name: ${{ matrix.runner }} JRuby
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            jruby_opts: ""
          - runner: macos-15
            jruby_opts: "-J-XstartOnFirstThread"
    runs-on: ${{ matrix.runner }}
    env:
      JRUBY_OPTS: ${{ matrix.jruby_opts }}
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: jruby
          bundler-cache: true
      - name: Download libui shared libraries
        run: bundle exec rake vendor:auto
      - name: Rake test
        uses: coactions/setup-xvfb@v1
        with:
          run: bundle exec rake test
